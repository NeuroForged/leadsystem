server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ── Prod: Full technical log (JSON) ─────────────────────────────────────────
  #
  # Labels (low cardinality, indexed):  app, env, level, clientId
  # High-cardinality fields (req, userId) are queryable from the JSON body:
  #   {app="leadsystem"} | json | req="abc123"
  #   {app="leadsystem"} | json | clientId="3" | level="ERROR"
  #
  - job_name: leadsystem-full
    static_configs:
      - targets:
          - localhost
        labels:
          job: leadsystem
          app: leadsystem
          env: prod
          log_type: full
          __path__: /var/log/leadsystem/app.log
    pipeline_stages:
      # Parse JSON — extract fields to promote as labels
      - json:
          expressions:
            level: level
            clientId: clientId
            ts: ts
      # Only low-cardinality fields become indexed Loki labels
      - labels:
          level:
          clientId:
      # Timestamp from the JSON 'ts' field (RFC3339Nano from Logstash encoder)
      # Previously had source: timestamp — wrong field name; 'ts' is correct per logback-spring.xml
      - timestamp:
          source: ts
          format: RFC3339Nano
          action_on_failure: skip

  # ── Prod: Business event log (plain text) ───────────────────────────────────
  #
  # Format:  HH:mm:ss [MARKER]   ✓/✗  action  key=val  ...
  # Example: 08:15:30 [LEAD]    ✓ received  client=Acme  email=x@y.com
  #
  # Extracted labels:  marker (LEAD/MEETING/WEBHOOK/SCRAPE/SCHED/AUTH/OAUTH)
  #                    outcome (ok / fail)
  #
  - job_name: leadsystem-events
    static_configs:
      - targets:
          - localhost
        labels:
          job: leadsystem-events
          app: leadsystem
          env: prod
          log_type: events
          __path__: /var/log/leadsystem/events.log
    pipeline_stages:
      # Capture marker without brackets, and raw outcome symbol
      - regex:
          expression: '^\d{2}:\d{2}:\d{2} \[(?P<marker>[A-Z]+)\]\s+(?P<outcome>\S+)'
      # Map ✓ → ok, anything else → fail
      - template:
          source: outcome
          template: '{{ if eq .Value "✓" }}ok{{ else }}fail{{ end }}'
      - labels:
          marker:
          outcome:

  # ── Dev: Full technical log (JSON) ──────────────────────────────────────────
  - job_name: leadsystem-full-dev
    static_configs:
      - targets:
          - localhost
        labels:
          job: leadsystem
          app: leadsystem
          env: dev
          log_type: full
          __path__: /var/log/leadsystem-dev/app.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            clientId: clientId
            ts: ts
      - labels:
          level:
          clientId:
      - timestamp:
          source: ts
          format: RFC3339Nano
          action_on_failure: skip

  # ── Dev: Business event log (plain text) ─────────────────────────────────────
  - job_name: leadsystem-events-dev
    static_configs:
      - targets:
          - localhost
        labels:
          job: leadsystem-events
          app: leadsystem
          env: dev
          log_type: events
          __path__: /var/log/leadsystem-dev/events.log
    pipeline_stages:
      - regex:
          expression: '^\d{2}:\d{2}:\d{2} \[(?P<marker>[A-Z]+)\]\s+(?P<outcome>\S+)'
      - template:
          source: outcome
          template: '{{ if eq .Value "✓" }}ok{{ else }}fail{{ end }}'
      - labels:
          marker:
          outcome:
