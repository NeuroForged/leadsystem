server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # --- Full technical log (JSON) ---
  - job_name: leadsystem-full
    static_configs:
      - targets:
          - localhost
        labels:
          job: leadsystem
          app: leadsystem
          env: prod
          log_type: full
          __path__: /var/log/leadsystem/app.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger_name
            req: req
            clientId: clientId
            userId: userId
      - labels:
          level:
          logger:
          req:
          clientId:
          userId:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          action_on_failure: skip

  # --- Business event log (plain text) ---
  - job_name: leadsystem-events
    static_configs:
      - targets:
          - localhost
        labels:
          job: leadsystem-events
          app: leadsystem
          env: prod
          log_type: events
          __path__: /var/log/leadsystem/events.log

  # --- Dev environment (api-dev.alchemizeiq.com) ---
  - job_name: leadsystem-full-dev
    static_configs:
      - targets:
          - localhost
        labels:
          job: leadsystem
          app: leadsystem
          env: dev
          log_type: full
          __path__: /var/log/leadsystem-dev/app.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger_name
            req: req
            clientId: clientId
            userId: userId
      - labels:
          level:
          logger:
          req:
          clientId:
          userId:

  - job_name: leadsystem-events-dev
    static_configs:
      - targets:
          - localhost
        labels:
          job: leadsystem-events
          app: leadsystem
          env: dev
          log_type: events
          __path__: /var/log/leadsystem-dev/events.log
