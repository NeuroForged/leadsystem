spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
calendly:
  client_id: ${CALENDLY_CLIENT_ID}
  redirect-uri: ${CALENDLY_REDIRECT_URI}
  client-secret: ${CALENDLY_CLIENT_SECRET}
  webhook-signing-key: ${CALENDLY_WEBHOOK_SIGNING_KEY}
  scope: organization.read scheduled_events.read scheduled_events.read_all
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true

neuroforged:
  admin:
    email: ${NEUROFORGED_ADMIN_EMAIL}
    password: ${NEUROFORGED_ADMIN_PASSWORD}
  jwt:
    secret: ${NEUROFORGED_JWT_SECRET}
  cookie:
    # LSB-159: shared across subdomains in prod/dev. Override per-env via NEUROFORGED_COOKIE_DOMAIN.
    domain: ${NEUROFORGED_COOKIE_DOMAIN:alchemizeiq.com}
  portal:
    # LSB-164: used to build reset-password links in transactional emails.
    url: ${NEUROFORGED_PORTAL_URL:https://app.alchemizeiq.com}
  cors:
    allowed-origins: ${NEUROFORGED_CORS_ALLOWED_ORIGINS}
  mail:
    from: ${NEUROFORGED_MAIL_FROM}
  tokens:
    internal: ${NEUROFORGED_INTERNAL_TOKEN}
  encryption-key: ${NEUROFORGED_ENCRYPTION_KEY:}
  seed-sample-data: ${NEUROFORGED_SEED_SAMPLE_DATA:false}
  schema-audit:
    # LSB-168: post V20/V21, entity↔DB mapping is in a clean state. Abort
    # startup on drift so the next entity-without-migration footgun is loud
    # instead of buried in WARN logs. Override with NEUROFORGED_SCHEMA_AUDIT_FAIL=false
    # if a future migration needs to deploy ahead of the entity that backs it.
    fail-on-drift: ${NEUROFORGED_SCHEMA_AUDIT_FAIL:true}
  redis:
    # LSB-167: Redis URL for the Bucket4j rate-limit ProxyManager. Set in
    # Coolify alongside the leadsystem service (small Redis service on the
    # same project network).
    url: ${REDIS_URL}

rate-limit:
  requests-per-minute: ${RATE_LIMIT_RPM:60}
  requests-per-hour: ${RATE_LIMIT_RPH:500}

scraper:
  api-url: ${SCRAPER_API_URL:https://scraper.alchemizeiq.com}
  api-key: ${SCRAPER_API_KEY}

logging:
  level:
    com.neuroforged.leadsystem: DEBUG
    org.springframework: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN